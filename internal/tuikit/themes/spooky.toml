# Termino spooky theme — dark purple palette with orange accent

[colors]
surface     = "#1A0A2E"
surface_alt = "#120720"
text        = "#E8D5FF"
text_muted  = "#5A4570"
accent      = "#FF6B00"
success     = "#39FF14"
warning     = "#FFD700"
danger      = "#FF3131"
border      = "#3D1F6E"
done        = "#5A4570"

[symbols]
done     = "👻"
high     = "🔥"
critical = "💀"
medium   = "🕷"
low      = "🌙"

[options]
border_style = "rounded"
