# Termino catppuccin-mocha theme — Catppuccin Mocha palette (catppuccin.com), mauve accent

[colors]
surface     = "#1E1E2E"
surface_alt = "#181825"
text        = "#CDD6F4"
text_muted  = "#7F849C"
accent      = "#CBA6F7"
success     = "#A6E3A1"
warning     = "#F9E2AF"
danger      = "#F38BA8"
border      = "#45475A"
done        = "#6C7086"

[symbols]
done     = "✓"
high     = "▲"
critical = "!!!"
medium   = "–"
low      = "▼"

[options]
border_style = "rounded"
