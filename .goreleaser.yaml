# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: termino

before:
  hooks:
    - go test ./...

builds:
  - id: termino
    main: ./cmd/termino
    binary: termino
    # modernc.org/sqlite is pure Go: no cgo, fully static binaries.
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/lesquel/termino/internal/cli.Version={{ .Version }}

archives:
  - id: termino
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^style:"

release:
  github:
    owner: lesquel
    name: termino
  # Publish immediately so install.sh (GitHub /releases/latest) sees it.
  draft: false
  # Tags like v1.2.0-rc1 become pre-releases and are skipped by /releases/latest.
  prerelease: auto
