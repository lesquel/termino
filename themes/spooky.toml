# Termino spooky theme — dark horror palette with orange accent
#
#   ( )   ( )   ( )
#  (   ) (   ) (   )
#   |_|   |_|   |_|
#   |_|   |_|   |_|  👻  BOO!

[colors]
surface     = "#0d0d1a"
surface_alt = "#0a0a14"
text        = "#f0e6ff"
text_muted  = "#5a4570"
accent      = "#ff6b00"
success     = "#7fff00"
warning     = "#ff6b00"
danger      = "#ff0040"
border      = "#3d1f6e"
done        = "#5a4570"

[symbols]
done     = "👻"
high     = "🔥"
critical = "💀"
medium   = "🕷"
low      = "🌙"

[options]
border_style = "double"
motion       = true

[celebration]
ascii_art = """
  .-""""""-.
 /          \\
|  O      O  |
|    ----    |
 \\          /
  '--------'
   👻 BOO! 👻
"""
