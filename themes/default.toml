# Termino default theme

[colors]
surface     = "#1a1a2e"
surface_alt = "#16213e"
text        = "#e0e0e0"
text_muted  = "#6b7280"
accent      = "#7c3aed"
success     = "#22c55e"
warning     = "#f59e0b"
danger      = "#ef4444"
border      = "#374151"
done        = "#6b7280"

[symbols]
done     = "✓"
high     = "▲"
critical = "!!!"
medium   = "–"
low      = "▼"

[options]
border_style = "rounded"
motion       = true
